<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Parkingplan</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #1f6feb; --accent-text: #fff; --danger: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1c2027; --text: #e6e8eb; --muted: #9aa3ae; --line: #2c323b; --accent: #4c8dff; --danger: #ef5350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, button { font: inherit; color: inherit; }
  input { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  button { margin-top: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .fehler { color: var(--danger); margin: 0; min-height: 1.45em; }
</style>
</head>
<body>
<form id="login">
  <h1>Parkingplan</h1>
  <label>Benutzername<input name="benutzer" autocomplete="username" required autofocus></label>
  <label>Passwort<input name="passwort" type="password" autocomplete="current-password" required></label>
  <p class="fehler" id="fehler" role="alert"></p>
  <button type="submit">Anmelden</button>
</form>
<script>
document.getElementById('login').onsubmit = async (e) => {
  e.preventDefault();
  const knopf = e.target.querySelector('button');
  const fehler = document.getElementById('fehler');
  knopf.disabled = true;
  fehler.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    if (r.ok) return location.replace('/');
    fehler.textContent = (await r.json().catch(() => ({}))).error || 'Anmeldung fehlgeschlagen';
    e.target.passwort.select();
  } catch {
    fehler.textContent = 'Server nicht erreichbar';
  } finally {
    knopf.disabled = false;
  }
};
</script>
</body>
</html>
